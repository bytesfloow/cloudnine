<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- 浏览器 UI 主题色：跟随系统深浅色（桌面壳内的手动主题不影响浏览器外框） -->
    <meta name="theme-color" content="#f3f3f3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#202020" media="(prefers-color-scheme: dark)" />
    <title>CloudNine</title>
    <script>
      /* 首帧前落定主题。
         没有这段：data-theme 要等 React 的 effect（store.applyTheme）才写入，
         CSS 变量在首帧还是空的 → body 背景回落成浏览器默认白 → 暗色用户每次加载都闪一下白。
         这里与 store.js 的解析规则保持一致：显式 light/dark 优先，auto 看系统偏好。 */
      (function () {
        var resolved = 'light';
        try {
          var saved = localStorage.getItem('cloudnine-theme') || 'auto';
          resolved = saved === 'auto'
            ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
            : (saved === 'dark' ? 'dark' : 'light');
        } catch (e) { /* 隐私模式禁 localStorage 时按亮色起步，applyTheme 随后会再校正 */ }
        document.documentElement.dataset.theme = resolved;
        document.documentElement.style.colorScheme = resolved;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
