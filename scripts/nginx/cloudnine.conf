# CloudNine 反向代理配置
# 放置位置：/etc/nginx/sites-available/cloudnine
# 启用：ln -s /etc/nginx/sites-available/cloudnine /etc/nginx/sites-enabled/cloudnine
#
# 说明：
# - 应用自身监听 127.0.0.1:8480，不直接对外暴露
# - /ws/ 需要 WebSocket 升级头，且终端是长连接，超时必须调大

# WebSocket 升级映射（必须在 http 上下文，sites-enabled 会被包含进 http，故此处可用）
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream cloudnine_app {
    server 127.0.0.1:8480;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # 上传大文件（默认单文件上限 4096MB）
    client_max_body_size 4096m;
    client_body_timeout 600s;

    access_log /var/log/nginx/cloudnine.access.log;
    error_log  /var/log/nginx/cloudnine.error.log;

    location / {
        proxy_pass http://cloudnine_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    # 终端 WebSocket：长连接，必须单独设置超时
    location /ws/ {
        proxy_pass http://cloudnine_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
